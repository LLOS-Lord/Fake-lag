			shellScript = "# Without this phase the shipped .app contains NO payload at all, so both\n# injection paths (ellekit TweakInject + remote dlopen) silently capture nothing.\nset -e\nSRC=\"$SRCROOT/HybridFakeLagV2/Payload\"\nAPP=\"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nSDK=\"$(xcrun --sdk iphoneos --show-sdk-path)\"\nmkdir -p \"$APP\"\n# -std= is mandatory, not cosmetic: a .mm built with no -std gets whatever\n# the toolchain defaults to (gnu++98 for Objective-C++ on Xcode 15), where\n# std::atomic does not exist and every gX{0} declaration is a parse error.\nxcrun -sdk iphoneos clang \\\n  -dynamiclib -arch arm64 -miphoneos-version-min=14.0 -isysroot \"$SDK\" \\\n  -DHYBRID_PAYLOAD_BUILD=1 -fobjc-arc -std=gnu++17 -O2 -Wall -Wno-unused-function \\\n  -install_name /usr/lib/libNetHookPayload.dylib \\\n  -framework Foundation \\\n  \"$SRC/fishhook.c\" \"$SRC/NetHookPayload.mm\" \\\n  -o \"$APP/libNetHookPayload.dylib\"\necho \"payload built: $APP/libNetHookPayload.dylib\"\n";
