                AA10BB22CC33DD44EE55FF66 /* Build NetHookPayload */ = {isa = PBXShellScriptBuildPhase; buildActionMask = 2147483647; files = (); inputPaths = ("$(SRCROOT)/Payload/NetHookPayload.mm", "$(SRCROOT)/Payload/fishhook.c"); name = "Build NetHookPayload"; outputPaths = ("$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/libNetHookPayload.dylib"); runOnlyForDeploymentPostprocessing = 0; shellPath = /bin/sh; shellScript = "# Build the injectable fishhook payload as its own dylib and embed it\n# into the .app bundle (ProcessManager looks it up with pathForResource:).\n# NetHookPayload.mm is guarded with #ifdef HYBRID_PAYLOAD_BUILD so the host\n# app target compiles it as an empty TU and NEVER hooks its own sockets.\nset -e\nOUT=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/libNetHookPayload.dylib\"\nmkdir -p \"$(dirname \"$OUT\")\"\n\nARCHS_PAYLOAD=arm64\nCLANG_BIN=$(xcrun -find clang)\n\n\"$CLANG_BIN\" -arch \"$ARCHS_PAYLOAD\" -dynamiclib \\\n  -miphoneos-version-min=14.0 -isysroot \"$SDKROOT\" \\\n  -I\"$SRCROOT/headers\" -I\"$SRCROOT/Payload\" \\\n  -DHYBRID_PAYLOAD_BUILD \\\n  \"$SRCROOT/Payload/NetHookPayload.mm\" \"$SRCROOT/Payload/fishhook.c\" \\\n  -framework Foundation -lobjc \\\n  -install_name \"@rpath/libNetHookPayload.dylib\" \\\n  -o \"$OUT\"\n\necho \"NetHookPayload built at $OUT\"\nls -l \"$OUT\"\n"; };
/* End PBXShellScriptBuildPhase section */

