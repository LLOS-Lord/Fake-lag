name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
          chmod +x ldid

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -destination 'generic/platform=iOS'

      - name: Locate extension and prepare for signing
        run: |
          # Tìm tất cả các file .appex trong thư mục build
          echo "Searching for extension bundles..."
          find ./build -name "*.appex" -type d
          
          # Lấy đường dẫn extension đầu tiên tìm thấy
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          
          if [ -z "$EXT_PATH" ]; then
            echo "❌ No extension found! Build may have failed silently."
            exit 1
          fi
          
          echo "Found extension at: $EXT_PATH"
          
          # Tạo thư mục PlugIns nếu chưa có
          APP_PLUGINS="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns"
          mkdir -p "$APP_PLUGINS"
          
          # Sao chép extension vào PlugIns (nếu chưa có)
          if [ ! -d "$APP_PLUGINS/$(basename "$EXT_PATH")" ]; then
            cp -R "$EXT_PATH" "$APP_PLUGINS/"
            echo "Copied extension to app bundle"
          else
            echo "Extension already in app bundle"
          fi

      - name: Fake sign app binary
        run: |
          # Lấy file thực thi chính (không phải PkgInfo, Info.plist,...)
          APP_BIN=$(find "./build/Build/Products/Release-iphoneos/PacketBlocker.app" -type f -not -name "*.plist" -not -name "PkgInfo" | head -1)
          echo "Signing app binary: $APP_BIN"
          file "$APP_BIN"
          ./ldid -S PacketBlocker/PacketBlocker.entitlements "$APP_BIN"

      - name: Fake sign extension binary
        run: |
          # Tương tự cho extension
          EXT_BUNDLE=$(find "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns" -name "*.appex" -type d | head -1)
          EXT_BIN=$(find "$EXT_BUNDLE" -type f -not -name "*.plist" -not -name "PkgInfo" | head -1)
          echo "Signing extension binary: $EXT_BIN"
          file "$EXT_BIN"
          ./ldid -S PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN"

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
