name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid for Apple Silicon
        run: |
          # Tải bản arm64 chính thức từ Procursus
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid
          # Kiểm tra file thực thi được
          file ldid
          ./ldid 2>&1 || true

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Locate extension and copy to app bundle
        run: |
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -z "$EXT_PATH" ]; then
            echo "❌ No extension found!"
            exit 1
          fi
          echo "Found extension: $EXT_PATH"
          APP_PLUGINS="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns"
          mkdir -p "$APP_PLUGINS"
          cp -R "$EXT_PATH" "$APP_PLUGINS/"
          echo "Extension copied."

      - name: Strip bitcode (if any)
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"
          for BIN in "$APP_BIN" "$EXT_BIN"; do
            echo "Stripping bitcode from $BIN"
            xcrun bitcode_strip "$BIN" -r -o "$BIN"
          done

      - name: Fake sign app binary
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          echo "Signing app with ldid..."
          ./ldid -S PacketBlocker/PacketBlocker.entitlements "$APP_BIN"

      - name: Fake sign extension binary
        run: |
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"
          echo "Signing extension with ldid..."
          ./ldid -S PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN"

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
