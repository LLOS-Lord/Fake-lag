name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download signing tools
        run: |
          # Tải jtool2 v2.1 (bản ổn định)
          echo "Downloading jtool2 v2.1..."
          curl -L -o jtool https://github.com/coolstar/jtool2/releases/download/v2.1/jtool2_mac
          if file jtool | grep -q "Mach-O"; then
            chmod +x jtool
            echo "✅ jtool ready"
          else
            echo "⚠️ jtool2 v2.1 download failed, trying zsign..."
            rm -f jtool
            # Fallback: tải zsign
            curl -L -o zsign.zip https://github.com/zhlynn/zsign/releases/download/v1.0.3/zsign_macos.zip
            unzip zsign.zip
            chmod +x zsign
            echo "✅ zsign ready"
          fi

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Locate extension and copy to app bundle
        run: |
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -z "$EXT_PATH" ]; then
            echo "❌ No extension found!"
            exit 1
          fi
          echo "Found extension: $EXT_PATH"
          APP_PLUGINS="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns"
          mkdir -p "$APP_PLUGINS"
          cp -R "$EXT_PATH" "$APP_PLUGINS/"
          echo "Extension copied."

      - name: Thin and strip binaries
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"
          for BIN in "$APP_BIN" "$EXT_BIN"; do
            echo "Processing $BIN"
            if [ ! -f "$BIN" ]; then
              echo "❌ Binary not found: $BIN"
              exit 1
            fi
            # Thin về arm64 nếu cần
            if lipo -info "$BIN" | grep -q "Non-fat"; then
              echo "Already thin"
            else
              lipo -thin arm64 "$BIN" -o "${BIN}.thin"
              mv "${BIN}.thin" "$BIN"
            fi
            # Strip bitcode
            xcrun bitcode_strip "$BIN" -r -o "$BIN"
          done

      - name: Sign app binary (jtool or zsign)
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          ENT="PacketBlocker/PacketBlocker.entitlements"
          if [ -x jtool ]; then
            echo "Using jtool..."
            ./jtool --sign --entitlements "$ENT" --inplace "$APP_BIN"
          elif [ -x zsign ]; then
            echo "Using zsign..."
            ./zsign -k none -e "$ENT" -p "$APP_BIN" "$APP_BIN"
          else
            echo "❌ No signing tool found!"
            exit 1
          fi

      - name: Sign extension binary
        run: |
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"
          ENT="PacketBlockerExtension/PacketBlockerExtension.entitlements"
          if [ -x jtool ]; then
            echo "Using jtool..."
            ./jtool --sign --entitlements "$ENT" --inplace "$EXT_BIN"
          elif [ -x zsign ]; then
            echo "Using zsign..."
            ./zsign -k none -e "$ENT" -p "$EXT_BIN" "$EXT_BIN"
          else
            echo "❌ No signing tool found!"
            exit 1
          fi

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
