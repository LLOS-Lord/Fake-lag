name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download signing tools
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
          chmod +x ldid
          curl -L -o jtool https://github.com/coolstar/jtool2/releases/download/v2.2/jtool2_mac
          if file jtool | grep -q "Mach-O"; then
            chmod +x jtool
            echo "jtool OK"
          else
            echo "jtool download failed, removing"
            rm jtool
          fi

      - name: Build unsigned app (disable bitcode, arm64 only)
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Locate extension and prepare for signing
        run: |
          echo "Searching for extension bundles..."
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -z "$EXT_PATH" ]; then
            echo "❌ No extension found! Check build log."
            exit 1
          fi
          echo "Found extension at: $EXT_PATH"
          APP_PLUGINS="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns"
          mkdir -p "$APP_PLUGINS"
          if [ ! -d "$APP_PLUGINS/$(basename "$EXT_PATH")" ]; then
            cp -R "$EXT_PATH" "$APP_PLUGINS/"
            echo "Copied extension to app bundle"
          else
            echo "Extension already in app bundle"
          fi

      - name: Sign app binary (ldid shallow sign, fallback jtool)
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          echo "Signing app binary: $APP_BIN"
          if ./ldid -w -S PacketBlocker/PacketBlocker.entitlements "$APP_BIN" 2>&1; then
            echo "ldid success"
          elif [ -x jtool ]; then
            echo "Falling back to jtool..."
            ./jtool --sign --entitlements PacketBlocker/PacketBlocker.entitlements --inplace "$APP_BIN"
          else
            echo "No signing tool available"
            exit 1
          fi

      - name: Sign extension binary
        run: |
          EXT_BUNDLE=$(find "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns" -name "*.appex" -type d | head -1)
          EXT_BIN="$EXT_BUNDLE/$(basename "$EXT_BUNDLE" .appex)"
          echo "Signing extension binary: $EXT_BIN"
          if ./ldid -w -S PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN" 2>&1; then
            echo "ldid success"
          elif [ -x jtool ]; then
            echo "Using jtool for extension..."
            ./jtool --sign --entitlements PacketBlockerExtension/PacketBlockerExtension.entitlements --inplace "$EXT_BIN"
          else
            echo "Cannot sign extension"
            exit 1
          fi

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
