name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid (arm64)
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Copy extension into app
        run: |
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          mkdir -p ./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns
          cp -R "$EXT_PATH" ./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/

      # Bước kiểm tra nhanh cấu trúc file (Thay thế cho bước strip lỗi cũ)
      - name: Verify Binary Architecture
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          echo "Cấu trúc file hiện tại:"
          lipo -archs "$APP_BIN"

      - name: Sign app with ldid (Cadhoc + shallow)
        run: |
          ./ldid -Cadhoc -w -SPacketBlocker/PacketBlocker.entitlements \
            "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"

      - name: Sign extension with ldid
        run: |
          ./ldid -Cadhoc -w -SPacketBlockerExtension/PacketBlockerExtension.entitlements \
            "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
