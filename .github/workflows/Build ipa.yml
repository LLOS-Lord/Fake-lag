name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download signing tools
        run: |
          # Tải ldid
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
          chmod +x ldid
          # Tải jtool2 (dùng link chính thức, kiểm tra kỹ)
          curl -L -o jtool https://github.com/coolstar/jtool2/releases/download/v2.2/jtool2_mac
          if file jtool | grep -q "Mach-O"; then
            chmod +x jtool
            echo "jtool downloaded successfully"
          else
            echo "jtool download invalid, removing"
            rm -f jtool
          fi

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Locate extension and copy to app bundle
        run: |
          echo "Searching for extension..."
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -z "$EXT_PATH" ]; then
            echo "❌ No extension found! Build may have failed."
            exit 1
          fi
          echo "Found extension: $EXT_PATH"
          APP_PLUGINS="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns"
          mkdir -p "$APP_PLUGINS"
          cp -R "$EXT_PATH" "$APP_PLUGINS/"
          echo "Extension copied to app bundle"

      - name: Thin and strip binaries (remove bitcode, ensure arm64)
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"

          # Thin fat binaries nếu có (chỉ giữ arm64)
          for BIN in "$APP_BIN" "$EXT_BIN"; do
            if lipo -info "$BIN" | grep -q "Non-fat"; then
              echo "$BIN is already thin"
            else
              echo "Thinning $BIN..."
              lipo -thin arm64 "$BIN" -o "$BIN.thin"
              mv "$BIN.thin" "$BIN"
            fi
            # Strip bitcode triệt để
            xcrun bitcode_strip "$BIN" -r -o "$BIN"
          done

      - name: Sign app binary (ldid with fallback to jtool)
        run: |
          APP_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PacketBlocker"
          echo "Signing $APP_BIN"
          # Thử ldid với adhoc + shallow
          if ./ldid -C adhoc -w -S PacketBlocker/PacketBlocker.entitlements "$APP_BIN" 2>&1; then
            echo "ldid signed app successfully"
          elif [ -x jtool ]; then
            echo "ldid failed, using jtool..."
            ./jtool --sign --entitlements PacketBlocker/PacketBlocker.entitlements --inplace "$APP_BIN"
          else
            echo "ERROR: No signing tool available for app"
            exit 1
          fi

      - name: Sign extension binary
        run: |
          EXT_BIN="./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension"
          echo "Signing $EXT_BIN"
          if ./ldid -C adhoc -w -S PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN" 2>&1; then
            echo "ldid signed extension successfully"
          elif [ -x jtool ]; then
            echo "ldid failed, using jtool..."
            ./jtool --sign --entitlements PacketBlockerExtension/PacketBlockerExtension.entitlements --inplace "$EXT_BIN"
          else
            echo "ERROR: No signing tool available for extension"
            exit 1
          fi

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
