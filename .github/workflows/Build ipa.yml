name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid (arm64)
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Prepare Payload Structure
        run: |
          mkdir -p Payload/PacketBlocker.app/PlugIns
          # Tìm và copy App chính
          cp -R ./build/Build/Products/Release-iphoneos/PacketBlocker.app/* Payload/PacketBlocker.app/
          
          # Tìm và copy Extension vào thư mục PlugIns
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -d "$EXT_PATH" ]; then
            cp -R "$EXT_PATH" Payload/PacketBlocker.app/PlugIns/
            echo "Extension copied from $EXT_PATH"
          else
            echo "Error: Extension not found!"
            exit 1
          fi

      - name: Sign extension with ldid
        run: |
          EXT_DIR="Payload/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex"
          EXT_BIN="$EXT_DIR/PacketBlockerExtension"
          
          # Đảm bảo file binary có quyền thực thi
          chmod +x "$EXT_BIN"
          
          # Ký Extension với Entitlements của nó
          ./ldid -Cadhoc -w -SPacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN"
          echo "Extension signed successfully"

      - name: Sign app with ldid
        run: |
          APP_BIN="Payload/PacketBlocker.app/PacketBlocker"
          
          # Đảm bảo file binary có quyền thực thi
          chmod +x "$APP_BIN"
          
          # Ký App chính với Entitlements của nó
          ./ldid -Cadhoc -w -SPacketBlocker/PacketBlocker.entitlements "$APP_BIN"
          echo "Main app signed successfully"

      - name: Create IPA
        run: |
          zip -r PacketBlocker.ipa Payload
          echo "IPA created: PacketBlocker.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
