name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
          chmod +x ldid

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -destination 'generic/platform=iOS'

      - name: Inspect built products
        run: |
          echo "=== App bundle contents ==="
          ls -la "./build/Build/Products/Release-iphoneos/PacketBlocker.app/"
          echo "=== Extension bundle contents ==="
          ls -la "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/"

      - name: Find and sign app binary
        run: |
          # Tìm file Mach-O trong app bundle (thường là file cùng tên target)
          APP_BIN=$(find "./build/Build/Products/Release-iphoneos/PacketBlocker.app" -type f -not -name "*.plist" -not -name "*.storyboardc" -not -name "*.nib" | head -1)
          echo "Signing app binary: $APP_BIN"
          file "$APP_BIN"
          ./ldid -S PacketBlocker/PacketBlocker.entitlements "$APP_BIN"

      - name: Find and sign extension binary
        run: |
          EXT_BIN=$(find "./build/Build/Products/Release-iphoneos/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex" -type f -not -name "*.plist" -not -name "*.storyboardc" -not -name "*.nib" | head -1)
          echo "Signing extension binary: $EXT_BIN"
          file "$EXT_BIN"
          ./ldid -S PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN"

      - name: Create IPA
        run: |
          APP="./build/Build/Products/Release-iphoneos/PacketBlocker.app"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PacketBlocker.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker
          path: PacketBlocker.ipa
