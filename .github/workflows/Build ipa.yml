name: Build PacketBlocker IPA for TrollStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid (arm64)
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid

      - name: Create enhanced entitlements for main app
        run: |
          cat > PacketBlocker.entitlements << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.networkextension.manager</key>
              <true/>
              <key>com.apple.private.memorystatus</key>
              <true/>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.ban.PacketBlocker</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Create enhanced entitlements for extension
        run: |
          cat > PacketBlockerExtension.entitlements << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.networkextension.manager</key>
              <true/>
              <key>com.apple.private.networkextension.packet-tunnel-provider</key>
              <true/>
              <key>com.apple.private.memorystatus</key>
              <true/>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.ban.PacketBlocker</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PacketBlocker.xcodeproj \
            -scheme PacketBlocker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -destination 'generic/platform=iOS'

      - name: Prepare Payload structure
        run: |
          mkdir -p Payload/PacketBlocker.app/PlugIns
          # Copy app chính
          cp -R ./build/Build/Products/Release-iphoneos/PacketBlocker.app/* Payload/PacketBlocker.app/
          
          # Tìm và copy extension
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -d "$EXT_PATH" ]; then
            cp -R "$EXT_PATH" Payload/PacketBlocker.app/PlugIns/
            echo "Extension copied from $EXT_PATH"
          else
            echo "Error: Extension not found!"
            exit 1
          fi
          
          # Đảm bảo Info.plist có quyền đọc
          chmod 644 Payload/PacketBlocker.app/Info.plist

      - name: Sign extension with ldid
        run: |
          EXT_DIR="Payload/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex"
          EXT_BIN="$EXT_DIR/PacketBlockerExtension"
          
          # Đảm bảo binary có quyền thực thi
          chmod +x "$EXT_BIN"
          
          # Copy entitlements vào thư mục extension (để đồng bộ)
          cp PacketBlockerExtension.entitlements "$EXT_DIR/entitlements.plist"
          
          # Ký với entitlements mạnh
          ./ldid -Cadhoc -w -SPacketBlockerExtension.entitlements "$EXT_BIN"
          echo "✅ Extension signed successfully"

      - name: Sign main app with ldid
        run: |
          APP_BIN="Payload/PacketBlocker.app/PacketBlocker"
          
          chmod +x "$APP_BIN"
          
          # Copy entitlements vào app bundle
          cp PacketBlocker.entitlements "Payload/PacketBlocker.app/entitlements.plist"
          
          # Ký app
          ./ldid -Cadhoc -w -SPacketBlocker.entitlements "$APP_BIN"
          echo "✅ Main app signed successfully"

      - name: Verify entitlements (optional)
        run: |
          echo "🔍 Verifying main app entitlements:"
          ./ldid -e Payload/PacketBlocker.app/PacketBlocker || true
          echo "🔍 Verifying extension entitlements:"
          ./ldid -e Payload/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension || true

      - name: Create IPA
        run: |
          zip -r PacketBlocker_TrollStore.ipa Payload
          echo "✅ IPA created: PacketBlocker_TrollStore.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker_TrollStore
          path: PacketBlocker_TrollStore.ipa
