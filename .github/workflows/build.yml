name: Build PacketBlocker TrollStore IPA (Hybrid V2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download ldid (arm64)
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid

      - name: Create enhanced entitlements for main app (Full TrollStore + Floating Button)
        run: |
          cat > PacketBlocker/PacketBlocker.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//W3C//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array><string>group.com.ban.PacketBlocker</string></array>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
                  <string>app-proxy-provider</string>
                  <string>content-filter-provider</string>
                  <string>dns-proxy</string>
              </array>
              <key>com.apple.developer.networking.manage-thread-network-credentials</key><true/>
              <key>platform-application</key><true/>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>com.apple.private.security.no-container</key><true/>
              <key>com.apple.private.security.container-required</key><false/>
              <key>com.apple.rootless.storage.TrollStore</key><true/>
              <key>com.apple.private.persona-mgmt</key><true/>
              <key>task_for_pid-allow</key><true/>
              <key>get-task-allow</key><true/>
              <key>com.apple.system-task-ports</key><true/>
              <key>com.apple.private.kernel.jetsam</key><true/>
              <key>com.apple.private.memorystatus</key><true/>
              <key>com.apple.springboard.accessibility-window-hosting</key><true/>
              <key>com.apple.backboard.client</key><true/>
              <key>com.apple.QuartzCore.displayable-context</key><true/>
              <key>com.apple.QuartzCore.secure-mode</key><true/>
              <key>com.apple.private.hid.manager.client</key><true/>
              <key>com.apple.private.hid.client.service-protected</key><true/>
              <key>com.apple.springboard.CFUserNotification</key><true/>
              <key>com.apple.springboard.appbackgroundstyle</key><true/>
              <key>com.apple.private.allow-background-haptics</key><true/>
              <key>com.apple.private.hid.client.event-dispatch</key><true/>
              <key>com.apple.private.hid.client.event-filter</key><true/>
              <key>com.apple.private.hid.client.event-monitor</key><true/>
              <key>com.apple.private.network.socket-delegate</key><true/>
              <key>com.apple.private.necp.match</key><true/>
              <key>com.apple.private.necp.policies</key><true/>
          </dict>
          </plist>
          EOF
          cat PacketBlocker/PacketBlocker.entitlements

      - name: Create enhanced entitlements for extension
        run: |
          cat > PacketBlockerExtension/PacketBlockerExtension.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//W3C//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array><string>group.com.ban.PacketBlocker</string></array>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
                  <string>app-proxy-provider</string>
              </array>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>platform-application</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build unsigned app (Fixed - No Kill)
        run: |
          xcodebuild -project PacketBlocker.xcodeproj -scheme PacketBlocker -configuration Release -sdk iphoneos -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="" ONLY_ACTIVE_ARCH=YES ENABLE_BITCODE=NO IPHONEOS_DEPLOYMENT_TARGET=14.0 -destination 'generic/platform=iOS' | tee build.log
          echo "Build finished, checking errors"
          if grep -q "error:" build.log; then
            echo "Build errors found:"
            grep -A2 "error:" build.log | head -n 100
            exit 1
          fi

      - name: Prepare Payload structure
        run: |
          mkdir -p Payload/PacketBlocker.app/PlugIns
          cp -R ./build/Build/Products/Release-iphoneos/PacketBlocker.app/* Payload/PacketBlocker.app/
          EXT_PATH=$(find ./build -name "*.appex" -type d | head -1)
          if [ -d "$EXT_PATH" ]; then
            cp -R "$EXT_PATH" Payload/PacketBlocker.app/PlugIns/
            echo "Extension copied from $EXT_PATH"
          else
            echo "Error: Extension not found!"
            find ./build -type d | head -n 20
            exit 1
          fi
          chmod 644 Payload/PacketBlocker.app/Info.plist || true

      - name: Sign extension with ldid
        run: |
          EXT_DIR="Payload/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex"
          EXT_BIN="$EXT_DIR/PacketBlockerExtension"
          chmod +x "$EXT_BIN"
          cp PacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_DIR/entitlements.plist" || true
          ./ldid -Cadhoc -w -SPacketBlockerExtension/PacketBlockerExtension.entitlements "$EXT_BIN"
          echo "✅ Extension signed"

      - name: Sign main app with ldid
        run: |
          APP_BIN="Payload/PacketBlocker.app/PacketBlocker"
          chmod +x "$APP_BIN"
          cp PacketBlocker/PacketBlocker.entitlements "Payload/PacketBlocker.app/entitlements.plist" || true
          ./ldid -Cadhoc -w -SPacketBlocker/PacketBlocker.entitlements "$APP_BIN"
          echo "✅ Main app signed"

      - name: Verify entitlements
        run: |
          echo "🔍 Main app:"
          ./ldid -e Payload/PacketBlocker.app/PacketBlocker || true
          echo "🔍 Extension:"
          ./ldid -e Payload/PacketBlocker.app/PlugIns/PacketBlockerExtension.appex/PacketBlockerExtension || true

      - name: Create IPA
        run: |
          zip -r PacketBlocker_TrollStore_HybridV2.ipa Payload
          ls -lh *.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketBlocker_TrollStore_HybridV2
          path: PacketBlocker_TrollStore_HybridV2.ipa
